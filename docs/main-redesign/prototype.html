<style>
:root{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;color:#253447;background:#f5f7fa;font-size:14px}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;background:white;border:1px solid #d6dee8;padding:8px 13px;border-radius:6px;color:#30455e}button:hover{background:#edf3fa}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:#2f5f8f;color:white;border-color:#2f5f8f}.primary:hover{background:#244c75}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #8bb5e5;outline-offset:2px}input,select,textarea{padding:9px;border:1px solid #cfd8e4;border-radius:5px;background:white;color:#253447;max-width:100%}textarea{width:100%;min-height:90px;resize:vertical}input[type=checkbox]{accent-color:#2f5f8f;width:16px;height:16px}.shell{display:grid;grid-template-columns:200px 1fr;min-height:100vh}aside{background:#182b42;color:#b8c7d8;padding:26px 16px}aside strong{color:white;font-size:22px;display:block;padding:0 12px}aside small{display:block;margin:12px;color:#9eb2c7}nav{margin-top:38px;display:grid;gap:8px}nav button{background:transparent;border:0;text-align:left;color:#b8c7d8;padding:13px}nav button.active,nav button:hover{background:#243f5f;color:white}aside .foot{font-size:12px;line-height:1.9;margin-top:70px;padding:12px;color:#9eb2c7}main{min-width:0;padding:24px 36px 100px;max-width:1560px;width:100%;margin:auto}.draft{background:#fff7e6;border:1px solid #f2dfac;color:#76551a;padding:11px 15px;border-radius:6px;font-size:12px;line-height:1.7}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:24px 0}h1{font-size:25px;margin:0 0 8px;font-weight:650}h2{font-size:18px;margin:0 0 10px}h3{font-size:15px;margin:0 0 12px}p{line-height:1.8;margin:8px 0}.muted{color:#738196;font-size:13px}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:28px 0}.step{padding:12px 8px;border-bottom:3px solid #e2e8f0;color:#75849a}.step.active{color:#2f5f8f;border-color:#2f5f8f;font-weight:600}.card{background:white;border:1px solid #e2e8f0;border-radius:9px;padding:24px;margin-bottom:20px}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.field{display:grid;gap:8px;margin:14px 0}.field input:not([type=checkbox]),.field select{width:100%}.engine{border:1px solid #dce4ed;background:#fbfcfe;border-radius:7px;padding:16px;margin:12px 0}.badge{display:inline-block;border-radius:4px;padding:3px 8px;background:#e8f0f8;color:#2f5f8f;font-size:12px}.warn{background:#fff3dd;color:#916309}.error{background:#ffedeb;color:#a53930}.ok{background:#e9f6ef;color:#28764d}.empty{border:1px dashed #ccd7e3;padding:28px;text-align:center;color:#738196;border-radius:7px;margin:16px 0}.hint{padding:12px 15px;background:#eef4fa;border-radius:6px;font-size:13px;line-height:1.8}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{font-size:12px;padding:5px 8px}.check{display:flex;gap:8px;align-items:center}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left;white-space:nowrap}th{background:#f7f9fc;font-size:12px;color:#65778e;font-weight:500}td,th{padding:13px 12px;border-bottom:1px solid #e9edf3}.bottom{position:fixed;bottom:0;left:200px;right:0;background:#fffffff5;border-top:1px solid #dfe6ef;padding:16px 36px;display:flex;justify-content:space-between;align-items:center;z-index:2}.summary{padding:14px 0;border-bottom:1px solid #edf1f5}.metric{font-size:30px;color:#2f5f8f;margin:12px 0}.tabs{display:flex;gap:8px;margin:20px 0}.tabs .active{background:#e8f0f8;color:#2f5f8f}.error-text{color:#ad3830;min-height:24px;margin:12px 0}dialog{border:1px solid #d4dfec;border-radius:12px;width:min(620px,94vw);padding:28px;box-shadow:0 20px 80px #182b4230}dialog::backdrop{background:#182b4260}.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}dl{display:grid;grid-template-columns:110px 1fr;gap:12px}dt{color:#738196}dd{margin:0}.trace{border-left:2px solid #d5e3f0;padding:6px 18px 18px;margin-left:8px}.trace strong{display:inline-block;margin-right:12px}a{color:#2f5f8f}@media(max-width:1050px){.shell{grid-template-columns:155px 1fr}main{padding:18px 20px 100px}.bottom{left:155px;padding:16px 20px}.grid{grid-template-columns:1fr}}@media(max-width:680px){.shell{display:block}aside{display:none}.bottom{left:0}.steps{gap:4px}.step{font-size:12px}main{padding:14px 14px 120px}.card{padding:16px}.top{align-items:flex-start}.bottom{padding:12px}.bottom span{max-width:42%;font-size:12px}}

<div class="shell"><aside><strong>睿检 IQC</strong><small>main 基线 · 设计预览</small><nav><button onclick="go(1)">会话中心</button><button id="nav-task" class="active" onclick="go(1)">任务中心</button><button onclick="showResult()">结果查看 · 示例</button></nav><div class="foot">只展示本轮核心入口。<br>此草图不代表删除 main 其他菜单。<br><br>规则、标签、模型配置继续复用现有页面。</div></aside><main><div class="draft">待审阅的离线设计草图 · 全部数据和执行结果均为模拟 · 不连接后端、不创建真实任务、不操作线上</div><div class="top"><div><div class="muted" id="crumb">任务中心 / 创建任务</div><h1 id="heading">创建任务</h1><div class="muted">选择数据，分别配置质检与打标，再执行和查看结果。</div></div><button onclick="resetDemo()">重置演示</button></div><div id="steps" class="steps"></div><div id="content"></div><div id="validation" class="error-text" role="alert"></div></main></div><footer class="bottom" id="footer"></footer>
<dialog id="config-dialog"><form id="config-form"><h2 id="config-title">配置引擎</h2><p class="muted">任务引用已有能力；下面的规则、模型与参数均为示例。</p><div class="field"><label for="engine-name">引擎名称</label><input id="engine-name" required maxlength="80"></div><div id="type-fields"></div><p class="hint">失败时记录原因，继续后续引擎。参数不完整时不会允许确认执行。</p><div class="dialog-actions"><button type="button" onclick="document.getElementById('config-dialog').close()">取消</button><button class="primary" type="submit">保存配置</button></div></form></dialog>
<script>
'use strict';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const conversations=[{id:'C001',name:'售后咨询 · 订单配送',agent:'张明',channel:'在线客服',count:18},{id:'C002',name:'业务咨询 · 套餐办理',agent:'李琳',channel:'电话文本',count:26},{id:'C003',name:'售后咨询 · 退款进度',agent:'张明',channel:'在线客服',count:14},{id:'C004',name:'服务咨询 · 使用说明',agent:'陈宁',channel:'在线客服',count:22},{id:'C005',name:'空会话 · 示例',agent:'陈宁',channel:'在线客服',count:0}];
let step=1,selected=new Set(['C001','C003']),taskName='售后会话质检与打标',enabled={inspection:true,labeling:true},engines={inspection:[],labeling:[]},serial=0,editing=null,view='wizard',tab='inspection',search='',page=1;
let selectionMode='BATCH',sampleSize=2,scopeChannel='',scopeKeyword='',previewIds=[],matchingIds=[],previewPage=1,previewScope='sample';
let processing={base:100,passing:80,deduction:10,label:'咨询类型',resolution:'pending'};
const opName=op=>op==='inspection'?'质检':'打标';
function resetDemo(){selectionMode='BATCH';sampleSize=2;scopeChannel='';scopeKeyword='';previewIds=[];step=1;selected=new Set(['C001','C003']);taskName='售后会话质检与打标';enabled={inspection:true,labeling:true};engines={inspection:[],labeling:[]};processing={base:100,passing:80,deduction:10,label:'咨询类型',resolution:'pending'};search='';page=1;view='wizard';render()}
function go(n){if(view==='wizard')capture();step=n;view='wizard';render()}
function capture(){if($('#sample-size'))sampleSize=+$('#sample-size').value;if($('#scope-channel'))scopeChannel=$('#scope-channel').value;if($('#scope-keyword'))scopeKeyword=$('#scope-keyword').value;if($('#task-name'))taskName=$('#task-name').value;if($('#base')){processing.base=+$('#base').value;processing.passing=+$('#passing').value;processing.deduction=+$('#deduction').value}if($('#label-target'))processing.label=$('#label-target').value;}
function render(){ $('#validation').textContent='';$('#heading').textContent=view==='result'?'任务详情 · 模拟执行结果':'创建任务';$('#crumb').textContent=view==='result'?'任务中心 / 执行与结果':'任务中心 / 创建任务';$('#steps').style.display=view==='result'?'none':'grid';$('#steps').innerHTML=['数据筛选','任务类型','结果处理','任务确认'].map((s,i)=>`<div class="step ${step===i+1?'active':''}">${i+1}　${s}</div>`).join('');if(view==='result'){renderResult();return}if(step===1)renderData();if(step===2)renderEngines();if(step===3)renderProcessing();if(step===4)renderConfirm();$('#footer').innerHTML=`<span class="muted">${esc(dataSummary())} · ${Object.keys(enabled).filter(k=>enabled[k]).map(opName).join(' + ')||'尚未选择操作'}</span><div class="row">${step>1?'<button onclick="go(step-1)">上一步</button>':''}<button class="primary" onclick="next()">${step===4?'模拟执行，查看结果':'下一步'}</button></div>`}
function dataSummary(){return selectionMode==='BATCH'?'批量选择 · 已选 '+selected.size+' 个会话':selectionMode==='RANDOM'?'随机抽样 · '+sampleSize+' 个会话':'条件筛选 · 运行时取数'}
function selectionTabs(){return `<section class="card"><h2>数据选择方式</h2><div class="tabs" role="group" aria-label="数据选择方式">${[['BATCH','批量选择'],['RANDOM','随机抽样'],['FILTER','条件筛选']].map(([key,name])=>`<button class="${selectionMode===key?'active':''}" onclick="switchSelection('${key}')">${name}</button>`).join('')}</div><p class="muted">${selectionMode==='BATCH'?'创建时确定会话列表；跨页选择会保留。':selectionMode==='RANDOM'?'创建时保存抽样范围与数量，执行时抽样并固定本次实际名单。':'创建时只保存条件；任务运行时按条件查询并固定本次实际会话列表。'}</p></section>`}
function switchSelection(mode){capture();selectionMode=mode;previewIds=[];render()}
function renderData(){if(selectionMode==='BATCH'){renderBatchData();$('#content').firstElementChild.insertAdjacentHTML('afterend',selectionTabs());return}$('#content').innerHTML=`<section class="card"><h2>任务信息</h2><div class="field"><label for="task-name">任务名称</label><input id="task-name" value="${esc(taskName)}" maxlength="80"></div></section>${selectionTabs()}<section class="card"><h2>${selectionMode==='RANDOM'?'设置抽样范围和数量':'设置运行时取数条件'}</h2><div class="grid"><div class="field"><label for="scope-channel">渠道</label><select id="scope-channel"><option value="">全部渠道</option><option>在线客服</option><option>电话文本</option></select></div><div class="field"><label for="scope-keyword">会话名称 / 编号 · 草图示例</label><input id="scope-keyword" value="${esc(scopeKeyword)}" placeholder="留空表示不限"></div></div><p class="muted">正式筛选复用 main 已有字段：文件名、坐席、客户、渠道、业务编号、会话时间；不是任意表达式。</p>${selectionMode==='RANDOM'?`<div class="field"><label for="sample-size">随机抽取数量</label><input id="sample-size" type="number" min="1" max="1000" step="1" value="${sampleSize}"></div><p class="hint">抽样不重复。预览仅用于查看范围，不会创建或固定真实任务数据；随机抽样和条件筛选都在执行时确定数据；不足时有多少处理多少。</p>`:'<p class="hint">创建时不固定会话 ID。预览只是当前估算，运行时数量可能变化；开始执行时取数并记录实际名单，同一执行重试使用该名单。</p>'}<div class="row" style="margin-top:18px"><button onclick="previewSelection()">模拟执行</button></div><div id="selection-preview" aria-live="polite" class="muted" style="margin-top:16px">点击“模拟执行”，在下方查看满足条件的会话列表；仅使用模拟数据。</div></section>`;$('#scope-channel').value=scopeChannel;for(const el of document.querySelectorAll('#scope-channel,#scope-keyword,#sample-size'))el.addEventListener('input',invalidatePreview)}
function conversationHeaders(first){return `<thead><tr><th>${first}</th><th>会话</th><th>坐席</th><th>渠道</th><th>消息数</th></tr></thead>`}
function conversationCells(r){return `<td>${esc(r.name)}<div class="muted">${r.id}</div></td><td>${esc(r.agent)}</td><td>${esc(r.channel)}</td><td>${r.count||'无消息，不可选'}</td>`}
function invalidatePreview(){previewIds=[];matchingIds=[];$('#selection-preview').innerHTML='条件或数量已修改，请重新点击“模拟执行”，更新数据列表。'}
function previewSelection(){capture();const rows=conversations.filter(r=>r.count>0&&(!scopeChannel||r.channel===scopeChannel)&&(!scopeKeyword||(r.id+r.name).includes(scopeKeyword)));if(selectionMode==='RANDOM'&&(!Number.isInteger(sampleSize)||sampleSize<1||sampleSize>1000)){ $('#selection-preview').textContent='抽样数量须为 1–1000 的整数。';return }matchingIds=rows.map(r=>r.id);const pool=[...rows];for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}previewIds=(selectionMode==='RANDOM'?pool.slice(0,sampleSize):rows).map(r=>r.id);previewPage=1;previewScope='sample';renderPreviewTable()}
function setPreviewScope(scope){previewScope=scope;previewPage=1;renderPreviewTable()}
function previewDataPage(delta){const n=previewScope==='all'?matchingIds.length:previewIds.length;previewPage=Math.max(1,Math.min(Math.ceil(n/3)||1,previewPage+delta));renderPreviewTable()}
function renderPreviewTable(){const random=selectionMode==='RANDOM',ids=random&&previewScope==='all'?matchingIds:previewIds,rows=ids.map(id=>conversations.find(r=>r.id===id)),pages=Math.max(1,Math.ceil(rows.length/3));$('#selection-preview').innerHTML=`<div class="row between"><h3>${random?(previewScope==='all'?'满足条件的会话':'随机抽样结果'):'满足条件的会话'}</h3><span class="badge">${random?'匹配 '+matchingIds.length+' 个 · 本次模拟抽样 '+previewIds.length+' 个':'当前匹配 '+matchingIds.length+' 个'}</span></div>${random?`<div class="tabs"><button class="${previewScope==='sample'?'active':''}" onclick="setPreviewScope('sample')">本次抽样结果 (${previewIds.length})</button><button class="${previewScope==='all'?'active':''}" onclick="setPreviewScope('all')">全部匹配数据 (${matchingIds.length})</button></div>`:''}${random&&matchingIds.length<sampleSize?'<p class="badge warn">匹配数量不足：请求 '+sampleSize+'，当前仅有 '+matchingIds.length+' 个。有多少处理多少，正式执行时重新取数。</p>':''}<div class="table-wrap"><table id="preview-table">${conversationHeaders(random?'抽样状态':'匹配状态')}<tbody>${rows.slice((previewPage-1)*3,previewPage*3).map(r=>`<tr><td><span class="badge ${previewIds.includes(r.id)?'ok':''}">${random?(previewIds.includes(r.id)?'本次抽中':'未抽中'):'满足条件'}</span></td>${conversationCells(r)}</tr>`).join('')||'<tr><td colspan="5">没有满足条件的会话，请调整条件后重新模拟执行。</td></tr>'}</tbody></table></div><div class="row between" style="margin-top:16px"><span>共 ${rows.length} 条 · 每页 3 条</span><div class="row"><button ${previewPage===1?'disabled':''} onclick="previewDataPage(-1)">上一页</button><span>${previewPage} / ${pages}</span><button ${previewPage===pages?'disabled':''} onclick="previewDataPage(1)">下一页</button></div></div><p class="muted">${random?'本次抽样结果来自满足条件的数据，不重复抽取。切换列表和分页不会重新抽样；再次模拟执行会重新演示抽样。':'运行时重新取数，不锁定此预览。'}模拟列表仅供核对，不会转成批量勾选名单，不创建任务或调用质检引擎。</p>`}
function renderBatchData(){ $('#content').innerHTML=`<section class="card"><h2>任务信息</h2><div class="field"><label for="task-name">任务名称</label><input id="task-name" value="${esc(taskName)}" maxlength="80" placeholder="为本次任务起一个名字"></div></section><section class="card"><div class="row between"><div><h2>从会话中心选择数据</h2><p class="muted">使用已处理好的会话，不包含语音转换。</p></div><span class="badge">已选 ${selected.size} 个</span></div><div class="row" style="margin:16px 0"><input id="search" aria-label="搜索会话" placeholder="搜索会话名称或编号" value="${esc(search)}"><button onclick="searchData()">筛选</button><button onclick="capture();selected.clear();render()">清空选择</button></div><div class="table-wrap"><table>${conversationHeaders('选择')}<tbody id="conversation-rows"></tbody></table></div><div class="row between" style="margin-top:16px"><span class="muted">跨页保留选择；空会话不可选。每页 3 条模拟数据。</span><div class="row"><button onclick="dataPage(-1)">上一页</button><span id="page-info"></span><button onclick="dataPage(1)">下一页</button></div></div></section>`;renderRows() }
function renderRows(){const rows=conversations.filter(r=>(r.id+r.name).includes(search));const total=Math.max(1,Math.ceil(rows.length/3));page=Math.min(page,total);$('#conversation-rows').innerHTML=rows.slice((page-1)*3,page*3).map(r=>`<tr><td><input type="checkbox" aria-label="选择 ${esc(r.name)}" ${selected.has(r.id)?'checked':''} ${r.count?'':'disabled'} onchange="selectConversation('${r.id}',this.checked)"></td>${conversationCells(r)}</tr>`).join('')||'<tr><td colspan="5">没有匹配的会话，请调整筛选条件。</td></tr>';$('#page-info').textContent=page+' / '+total}
function dataPage(delta){capture();const rows=conversations.filter(r=>(r.id+r.name).includes(search));page=Math.max(1,Math.min(Math.ceil(rows.length/3)||1,page+delta));renderRows()}
function searchData(){capture();search=$('#search').value;page=1;render()}
function selectConversation(id,on){capture();on?selected.add(id):selected.delete(id);render()}
function toggleOperation(op,on){enabled[op]=on;render()}
function renderEngines(){ $('#content').innerHTML=`<section class="card"><h2>本次任务做什么？</h2><p class="muted">可只选一项，也可两项同时执行；每项分别配置引擎。</p><div class="row" style="gap:30px;margin-top:18px">${['inspection','labeling'].map(op=>`<label class="check"><input type="checkbox" ${enabled[op]?'checked':''} onchange="toggleOperation('${op}',this.checked)">${opName(op)}</label>`).join('')}</div></section><div class="grid">${['inspection','labeling'].filter(op=>enabled[op]).map(enginePanel).join('')}</div><div class="hint">按列表从上到下执行。某个引擎失败仍执行后续引擎，保留失败记录；质检和打标互不阻断。首期建议各引擎读取完整会话，不暗含上游结果过滤。</div>` }
function enginePanel(op){return `<section class="card"><h2>${opName(op)}引擎</h2><p class="muted">可添加多个引擎，同类型也可使用不同配置。</p>${engines[op].map((e,i)=>`<div class="engine"><div class="row between"><strong>${i+1}. ${esc(e.name)}</strong><span class="badge ${e.configured?'':'warn'}">${e.configured?'已配置':'待配置'}</span></div><p class="muted">${esc(e.summary||'请先选择规则或模型，填写参数。')}</p><div class="actions"><button onclick="configure('${op}','${e.id}')">配置参数</button><button ${i===0?'disabled':''} onclick="move('${op}',${i},-1)">上移</button><button ${i===engines[op].length-1?'disabled':''} onclick="move('${op}',${i},1)">下移</button><button onclick="removeEngine('${op}','${e.id}')">移除</button></div></div>`).join('')||'<div class="empty">尚未添加引擎</div>'}<div class="row"><select id="add-${op}" aria-label="${opName(op)}引擎类型"><option value="REGEX">正则引擎</option><option value="DLS">DLS 引擎</option><option value="LLM">大模型</option><option disabled>小模型 · 后续支持</option></select><button onclick="addEngine('${op}')">＋ 添加引擎</button></div></section>`}
function addEngine(op){const type=$('#add-'+op).value;const e={id:'engine-'+(++serial),type,name:({REGEX:'正则引擎',DLS:'DLS 引擎',LLM:'大模型'})[type]+' '+(engines[op].length+1),configured:false};engines[op].push(e);render();configure(op,e.id)}
function configure(op,id){editing={op,id};const e=engines[op].find(x=>x.id===id);$('#config-title').textContent=opName(op)+' · '+e.type+' 参数';$('#engine-name').value=e.name;$('#type-fields').innerHTML=e.type==='LLM'?`<div class="field"><label for="asset">模型能力配置</label><select id="asset"><option>现有客服分析 Agent · 示例</option><option>现有通用模型配置 · 示例</option></select></div><div class="field"><label for="prompt">任务提示词</label><textarea id="prompt" required>${esc(e.prompt||('请根据会话完成'+opName(op)+'目标，给出判断依据。'))}</textarea></div><div class="row"><label for="temperature">温度</label><input id="temperature" type="number" min="0" max="1" step="0.1" value="${e.temperature??0}"><label for="timeout">超时（秒）</label><input id="timeout" type="number" min="1" max="120" value="${e.timeout??30}"></div>`:`<div class="field"><label for="asset">引用现有${e.type==='DLS'?' DLS 会话':'正则'}规则</label><select id="asset"><option>${e.type==='DLS'?'会话服务检查 · 现有 DLS 规则示例':'服务用语匹配 · 现有正则规则示例'}</option><option>另一条已有规则 · 示例</option></select></div><p class="muted">规则本体在现有规则页维护，任务记录本次使用的配置。</p>`;$('#type-fields').innerHTML+=`<div class="field"><label for="target">${op==='inspection'?'输出到质检项':'输出到标签'}</label><select id="target">${op==='inspection'?'<option>服务用语规范</option><option>服务流程完整性</option>':'<option>咨询类型</option><option>客户意向</option>'}</select></div><div class="field"><label for="mapping">输出映射（示例）</label><select id="mapping">${op==='inspection'?'<option>目标满足 → 通过；不满足 → 不通过</option><option>命中 → 不通过；未命中 → 通过</option>':'<option>按目标标签的合法值输出</option><option>命中 → 售后咨询；未命中 → 未知</option>'}</select></div>`;if(e.asset)$('#asset').value=e.asset;if(e.target)$('#target').value=e.target;if(e.mapping)$('#mapping').value=e.mapping;$('#config-dialog').showModal()}
$('#config-form').addEventListener('submit',event=>{event.preventDefault();const e=engines[editing.op].find(x=>x.id===editing.id);e.name=$('#engine-name').value.trim();if(!e.name)return;e.asset=$('#asset').value;e.target=$('#target').value;e.mapping=$('#mapping').value;if(e.type==='LLM'){e.prompt=$('#prompt').value;e.temperature=+$('#temperature').value;e.timeout=+$('#timeout').value}e.configured=true;e.summary=e.asset+' → '+e.target;$('#config-dialog').close();render()});
function move(op,index,delta){const a=engines[op];[a[index],a[index+delta]]=[a[index+delta],a[index]];render()}
function removeEngine(op,id){engines[op]=engines[op].filter(e=>e.id!==id);render()}
function renderProcessing(){ $('#content').innerHTML=`<div class="hint" style="margin-bottom:20px">引擎只产出判断和证据。评分、标签在后续按明确规则生成，不根据引擎数量重复扣分。</div><div class="grid">${enabled.inspection?`<section class="card"><h2>质检 → 评分</h2><p class="muted">以下是扣分制示例，实际标准待确认。</p><div class="field"><label for="base">基础分</label><input id="base" type="number" min="1" max="100" value="${processing.base}"></div><div class="field"><label for="passing">及格线</label><input id="passing" type="number" min="0" max="100" value="${processing.passing}"></div><div class="field"><label for="deduction">“服务用语规范”不通过时扣分</label><input id="deduction" type="number" min="0" max="100" value="${processing.deduction}"></div><p class="muted">同一质检项只计分一次。结果缺失或失败不能当作通过。</p></section>`:''}${enabled.labeling?`<section class="card"><h2>打标 → 标签</h2><div class="field"><label for="label-target">已有目标标签（简化演示）</label><select id="label-target"><option>咨询类型</option><option>客户意向</option></select></div><p>示例值域：售前咨询 / 售后咨询 / 业务办理。</p><p class="muted">实际按各引擎绑定的已有标签及值域校验。完整版本复用标签树，此处不演示新建标签。</p><p class="muted">未知、冲突、失败单独保留，不自动新增标签。</p></section>`:''}</div><section class="card"><h2>多引擎结果汇总</h2><p>所有引擎的原始输出、结构化结果、证据及失败记录全部保留，统一交给专门的结果处理器生成评分或标签。</p><p class="muted">执行顺序不代表结果优先级；引擎之间不覆盖结论。具体汇总规则由结果处理模块显式配置。</p></section>`;if($('#label-target'))$('#label-target').value=processing.label }
function renderConfirm(){ $('#content').innerHTML=`<section class="card"><h2>${esc(taskName)}</h2><div class="summary"><strong>数据选择</strong><p>${esc(dataSummary())}<br>${selectionMode==='BATCH'?esc([...selected].join('、')):esc('渠道：'+(scopeChannel||'不限')+'；关键词：'+(scopeKeyword||'不限'))}<br>${selectionMode==='FILTER'?'创建时保存条件，运行时查询并记录实际会话；预览不作为本次名单。':selectionMode==='RANDOM'?'创建时保存抽样范围与数量，执行时取数；不足时有多少处理多少，预览不等于最终名单。':'创建时保存选中的会话名单。'}</p></div>${['inspection','labeling'].filter(op=>enabled[op]).map(op=>`<div class="summary"><strong>${opName(op)}引擎顺序</strong><p>${engines[op].map(e=>esc(e.name)).join(' → ')}</p>${engines[op].map(e=>`<p class="muted">${esc(e.summary)} · ${esc(e.mapping)}</p>`).join('')}</div>`).join('')}<div class="summary"><strong>结果处理</strong>${enabled.inspection?`<p>评分示例：基础分 ${processing.base}，及格线 ${processing.passing}，“服务用语规范”不通过扣 ${processing.deduction} 分。</p>`:''}${enabled.labeling?`<p>标签示例：${esc(processing.label)}；实际按各引擎的目标映射。</p>`:''}<p class="muted">所有引擎结果和证据完整保留，交给结果处理器生成评分或标签。</p></div><p class="hint" style="margin-top:18px">某个引擎失败 → 保留失败记录 → 继续后续引擎；质检与打标互不阻断。本次确认会固定配置，后续改规则不改变本任务。</p><p class="muted">点击下方按钮仅打开模拟结果，未创建任务、未调用引擎。</p></section>` }
function next(){capture();let error='';if(step===1&&!taskName.trim())error='请填写任务名称。';if(step===1&&selectionMode==='BATCH'&&!selected.size)error='请至少选择一个有消息的会话。';if(step===1&&selectionMode==='RANDOM'&&(!Number.isInteger(sampleSize)||sampleSize<1||sampleSize>1000))error='抽样数量须为 1–1000 的整数。';if(step===2){if(!enabled.inspection&&!enabled.labeling)error='请至少选择质检或打标。';for(const op of ['inspection','labeling'])if(enabled[op]&&(!engines[op].length||engines[op].some(e=>!e.configured)))error='请为每个选中的操作添加引擎并完成参数配置。'}if(step===3&&enabled.inspection&&(!Number.isFinite(processing.base)||processing.base<1||processing.base>100||processing.passing<0||processing.passing>processing.base||processing.deduction<0||processing.deduction>100))error='请检查基础分、及格线和扣分：基础分 1–100，及格线不超过基础分，扣分 0–100。';if(error){$('#validation').textContent=error;return}if(step===4){view='result';tab=enabled.inspection?'inspection':'labeling';render()}else{step++;render()} }
function showResult(){if(view==='wizard')capture();view='result';tab=enabled.inspection?'inspection':'labeling';render()}
function setTab(t){tab=t;renderResult()}
function renderResult(){const sample=engines.inspection.length+engines.labeling.length>0;const ops=['inspection','labeling'].filter(op=>enabled[op]);let failed=false;for(const op of ops)if(engines[op].length>1)failed=true;const score=Math.max(0,processing.base-processing.deduction);$('#footer').innerHTML='<span class="muted">模拟结果，仅说明信息组织和异常展示。</span><button onclick="go(1)">返回创建流程</button>';$('#content').innerHTML=`<section class="card"><div class="row between"><h2>${esc(taskName||'任务示例')}</h2><span class="badge ${failed?'warn':'ok'}">${sample?(failed?'模拟：执行结束，存在引擎失败':'模拟：执行结束'):'固定结果示例'}</span></div><p class="muted">${esc(dataSummary())} · 下方为固定会话 C001 的结果示例，不是实际取数或执行结果</p><div class="grid"><div><div class="muted">质检评分</div><div class="metric">${enabled.inspection?score+' 分':'不计分'}</div></div><div><div class="muted">打标结果</div><div class="metric" style="font-size:22px">${enabled.labeling?'售后咨询':'未启用打标'}</div></div></div><p class="hint">示例展示一个目标已有可靠结果、但中间引擎失败的场景。若没有可用结果或发生未解决冲突，评分显示“待确认”，标签显示未知/冲突，不冒充通过。</p></section><div class="tabs">${enabled.inspection?`<button class="${tab==='inspection'?'active':''}" onclick="setTab('inspection')">质检评分</button>`:''}${enabled.labeling?`<button class="${tab==='labeling'?'active':''}" onclick="setTab('labeling')">打标标签</button>`:''}<button class="${tab==='trace'?'active':''}" onclick="setTab('trace')">引擎记录</button></div><section class="card">${tab==='trace'?ops.map(op=>`<h3>${opName(op)} · 按实际配置顺序展示</h3>${(engines[op].length?engines[op]:[{name:'尚未配置：固定展示示例',summary:'请返回向导添加引擎'}]).map((e,i)=>`<div class="trace"><strong>${i+1}. ${esc(e.name)}</strong><span class="badge ${i===1?'error':'ok'}">${i===1?'失败':'成功'}</span><p class="muted">${i===1?'模拟错误：本引擎调用超时，后续引擎继续执行。':esc(e.summary||'示例输出：目标判断和会话证据。')}</p></div>`).join('')}`).join(''):tab==='inspection'?`<h2>质检评分明细 · 示例</h2><div class="table-wrap"><table><thead><tr><th>质检项</th><th>判断</th><th>扣分</th><th>依据</th></tr></thead><tbody><tr><td>服务用语规范</td><td>不通过</td><td>${processing.deduction}</td><td>会话 M008：未使用约定结束用语 · 模拟证据</td></tr></tbody></table></div><p class="muted">基础分 ${processing.base} − ${processing.deduction} = ${score}；同一项不按引擎数量重复扣分。</p>`:`<h2>打标标签 · 示例</h2><dl><dt>标签</dt><dd>${esc(processing.label)}</dd><dt>标签值</dt><dd>售后咨询</dd><dt>状态</dt><dd><span class="badge ok">已确定</span></dd><dt>来源</dt><dd>有效引擎输出 · 模拟</dd><dt>证据</dt><dd>客户：“我想咨询一下退款进度。” · 模拟会话片段</dd></dl>`}</section>` }
render();
</script></html>
